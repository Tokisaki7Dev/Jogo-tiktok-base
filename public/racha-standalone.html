<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Racha de Carros 2D - TikTok Live</title>
  <!-- Socket.io CDN Oficial -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #070a12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container Tela Cheia Otimizado para iPhone / OBS / Vercel (100vh / 100vw) */
    #liveContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      background: #070a12;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      background: #070a12;
    }

    /* Overlays de transmissão */
    .overlay-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    /* Banner TikTok Live: CAIXA ALTA & NEON */
    .banner-instruction {
      background: linear-gradient(135deg, rgba(238, 29, 82, 0.95), rgba(147, 51, 234, 0.95), rgba(6, 182, 212, 0.95));
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(238, 29, 82, 0.65);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.35);
      text-align: center;
    }

    .banner-instruction .title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.95);
      color: #fff;
      animation: pulseText 2s infinite alternate;
    }

    @keyframes pulseText {
      0% { text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(238,29,82,0.8); }
      100% { text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 25px rgba(6,182,212,1); }
    }

    /* Temporizador de Contagem Regressiva 90s + Contador de Distância */
    .race-timer-wrapper {
      background: rgba(11, 15, 25, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    .timer-display {
      font-size: 19px;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
      letter-spacing: 1px;
    }

    .timer-display.urgent {
      color: #f43f5e;
      text-shadow: 0 0 14px rgba(244, 63, 94, 0.95);
      animation: bounceUrgent 0.8s infinite alternate;
    }

    @keyframes bounceUrgent {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-left: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4, #f59e0b);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
      transition: width 0.2s linear;
    }

    /* Tabela de Classificação no Topo */
    .leaderboard-card {
      background: rgba(11, 15, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .leaderboard-title {
      font-size: 9.5px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #f59e0b;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }

    .leader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      padding: 3.5px 7px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid transparent;
    }

    .leader-row.pos-1 {
      background: linear-gradient(90deg, rgba(234, 179, 8, 0.28), transparent);
      border-left-color: #eab308;
    }
    .leader-row.pos-2 {
      background: linear-gradient(90deg, rgba(203, 213, 225, 0.2), transparent);
      border-left-color: #cbd5e1;
    }
    .leader-row.pos-3 {
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.2), transparent);
      border-left-color: #d97706;
    }

    .leader-name {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 145px;
    }

    .badge-pos {
      font-weight: 900;
      width: 16px;
    }

    .leader-dist {
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      color: #38bdf8;
      font-weight: 700;
    }

    /* Toasts de Ações */
    .gift-toast-container {
      position: absolute;
      left: 12px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      max-width: 270px;
    }

    .gift-toast {
      background: rgba(11, 15, 25, 0.95);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastSlide 3s forwards;
      box-shadow: 0 4px 16px rgba(6, 182, 212, 0.35);
    }

    @keyframes toastSlide {
      0% { opacity: 0; transform: translateX(-30px); }
      12% { opacity: 1; transform: translateX(0); }
      80% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    /* PÓDIO DA RODADA (10 SEGUNDOS OVERLAY) */
    #victoryModal {
      position: absolute;
      inset: 0;
      background: rgba(7, 10, 18, 0.97);
      backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }

    #victoryModal.show {
      display: flex;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin: 14px 0 18px 0;
      align-items: flex-end;
    }

    .podium-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .podium-card.first {
      background: linear-gradient(180deg, rgba(234, 179, 8, 0.25), rgba(15, 23, 42, 0.95));
      border: 2px solid #eab308;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
      padding: 16px 6px;
    }

    .countdown-banner {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 800;
      color: #67e8f9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div id="liveContainer">
    <!-- Canvas 2D da Corrida -->
    <canvas id="gameCanvas" width="480" height="850"></canvas>

    <!-- Overlay da Transmissão (Apenas Banner, Timer e Classificação) -->
    <div class="overlay-ui">
      <div class="top-section">
        <!-- 1. Banner de Chamada do TikTok: CAIXA ALTA & NEON -->
        <div class="banner-instruction">
          <div class="title">⚡ COMENTE QUALQUER COISA PARA ENTRAR NA CORRIDA! ⚡</div>
        </div>

        <!-- 2. Temporizador 90s + Contador de Distância -->
        <div class="race-timer-wrapper">
          <span style="font-size: 12px;">⏱️</span>
          <div id="timerText" class="timer-display">01:30</div>
          <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
          </div>
        </div>

        <!-- 3. Tabela de Classificação ao Vivo -->
        <div class="leaderboard-card">
          <div class="leaderboard-title">
            <span>CLASSIFICAÇÃO AO VIVO</span>
            <span style="font-size: 9px; color: #94a3b8; font-family: monospace;">12 CARROS</span>
          </div>
          <div id="leaderboardList" class="leaderboard-list"></div>
        </div>
      </div>

      <!-- Toasts de Ações -->
      <div id="giftToasts" class="gift-toast-container"></div>

      <!-- Espaço livre -->
      <div></div>
    </div>

    <!-- PÓDIO DA RODADA (10 SEGUNDOS COM REINÍCIO AUTOMÁTICO) -->
    <div id="victoryModal">
      <div style="font-size: 42px; margin-bottom: 4px;">🏆</div>
      <div style="color: #fbbf24; font-size: 11px; font-weight: 900; letter-spacing: 1px;">FINAL DOS 90 SEGUNDOS</div>
      <h2 style="color: #ffffff; font-size: 20px; font-weight: 900; margin: 4px 0 10px 0;">PÓDIO DA RODADA</h2>

      <div class="podium-grid">
        <!-- 2º Lugar -->
        <div class="podium-card" id="podium2">
          <div style="font-weight: 900; color: #cbd5e1; font-size: 12px;">2º</div>
          <div id="podium2Name" style="font-weight: 700; font-size: 11px; margin-top: 3px;">@piloto2</div>
          <div id="podium2Dist" style="color: #38bdf8; font-size: 10px; font-weight: 800; font-family: monospace;">0m</div>
        </div>

        <!-- 1º Lugar -->
        <div class="podium-card first" id="podium1">
          <div style="font-size: 20px;">👑</div>
          <div style="font-weight: 900; color: #eab308; font-size: 13px;">1º CAMPEÃO</div>
          <div id="podium1Name" style="font-weight: 900; font-size: 13px; color: #fff; margin-top: 3px;">@piloto1</div>
          <div id="podium1Dist" style="color: #38bdf8; font-size: 12px; font-weight: 900; font-family: monospace;">0m</div>
        </div>

        <!-- 3º Lugar -->
        <div class="podium-card" id="podium3">
          <div style="font-weight: 900; color: #d97706; font-size: 12px;">3º</div>
          <div id="podium3Name" style="font-weight: 700; font-size: 11px; margin-top: 3px;">@piloto3</div>
          <div id="podium3Dist" style="color: #38bdf8; font-size: 10px; font-weight: 800; font-family: monospace;">0m</div>
        </div>
      </div>

      <div class="countdown-banner">
        <span>🔄</span>
        <span>Reiniciando corrida automaticamente em: <strong id="podiumCountdownText" style="color: #fff; font-size: 13px;">10</strong>s</span>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONEXÃO DIRETA AO BACKEND SOCKET.IO
    // ==========================================
    const SOCKET_URL = 'https://tiktok-live-backend-39v9.onrender.com';
    const socket = typeof io !== 'undefined' ? io(SOCKET_URL, {
      transports: ['websocket', 'polling'],
      timeout: 5000,
      reconnection: true,
      reconnectionAttempts: Infinity
    }) : null;

    if (socket) {
      socket.on('join', (data) => data?.username && addParticipant(data.username, data.color));
      socket.on('novo_jogador', (data) => data?.username && addParticipant(data.username, data.color));
      socket.on('turbo', (data) => handleSocketAction(data, 'TURBO'));
      socket.on('nitro', (data) => handleSocketAction(data, 'NITRO'));
      socket.on('oil', (data) => handleSocketAction(data, 'OLEO'));
      socket.on('oleo', (data) => handleSocketAction(data, 'OLEO'));
      socket.on('missile', (data) => handleSocketAction(data, 'MISSEL'));
      socket.on('missel', (data) => handleSocketAction(data, 'MISSEL'));
      socket.on('bomba', (data) => handleSocketAction(data, 'MISSEL'));
      socket.on('shield', (data) => handleSocketAction(data, 'ESCUDO'));
      socket.on('escudo', (data) => handleSocketAction(data, 'ESCUDO'));
      socket.on('action', (data) => data?.action && handleSocketAction(data, data.action.toUpperCase()));
      socket.on('reset', () => resetRace());
    }

    function handleSocketAction(data, actionType) {
      if (isFrozen) return;
      const username = data?.username;
      let targetCar = username ? cars.find(c => c.username.toLowerCase() === username.toLowerCase()) : null;
      if (!targetCar && cars.length > 0) {
        targetCar = (actionType === 'MISSEL' || actionType === 'OLEO')
          ? cars.reduce((max, c) => c.distance > max.distance ? c : max, cars[0])
          : cars[Math.floor(Math.random() * cars.length)];
      }
      if (targetCar) applyAction(targetCar, actionType, username || 'Live');
    }

    // ==========================================
    // 2. SISTEMA DE ÁUDIO SINTETIZADO (Web Audio)
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtx ? new AudioCtx() : null;

    function playSound(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      try {
        if (type === 'turbo' || type === 'missile') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(750, t + 0.3);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(t); osc.stop(t + 0.35);
        } else if (type === 'explosion') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, t);
          osc.frequency.exponentialRampToValueAtTime(25, t + 0.4);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(t); osc.stop(t + 0.45);
        } else if (type === 'shield') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(420, t);
          osc.frequency.exponentialRampToValueAtTime(950, t + 0.2);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'win') {
          [440, 554, 659, 880].forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(f, t + i * 0.1);
            gain.gain.setValueAtTime(0.15, t + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t + i * 0.1); osc.stop(t + i * 0.1 + 0.2);
          });
        }
      } catch (e) {}
    }

    // ==========================================
    // 3. MOTOR DA CORRIDA E CICLO DE 90 SEGUNDOS
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const RACE_DURATION = 90;
    let timeLeft = RACE_DURATION;
    let isFrozen = false;
    let trackScrollY = 0;
    let podiumCountdown = 10;
    let podiumInterval = null;

    const CAR_COLORS = [
      '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
      '#ec4899', '#06b6d4', '#eab308', '#14b8a6', '#f97316', '#a855f7', '#6366f1'
    ];

    const DEFAULT_PILOTS = [
      '@lucas_drift', '@pedro_turbo', '@julia_veloz', '@marcos_nitro', '@beatriz_gt',
      '@thiago_v8', '@camila_boost', '@gabriel_racha', '@larissa_speed', '@rafael_pro',
      '@felipe_vtec', '@daniela_boost'
    ];

    let cars = [];
    let particles = [];
    let skidMarks = [];
    let missiles = [];
    let floatingTexts = [];
    let speedLines = [];

    for (let i = 0; i < 25; i++) {
      speedLines.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 50 + 30,
        speed: Math.random() * 20 + 25,
        alpha: Math.random() * 0.35 + 0.1
      });
    }

    function initCars() {
      cars = DEFAULT_PILOTS.map((user, idx) => ({
        id: 'c_' + idx,
        username: user,
        color: CAR_COLORS[idx % CAR_COLORS.length],
        lane: idx % 6,
        x: 0, y: 0,
        distance: 0,
        speed: 180,
        baseSpeed: 175 + Math.random() * 20,
        turboTimer: 0, nitroTimer: 0, oilTimer: 0, stunTimer: 0, shieldTimer: 0,
        spinAngle: 0, driftAngle: 0, badgeOffset: 0,
        rank: idx + 1
      }));
    }

    function addParticipant(username, color) {
      if (cars.length >= 12) return;
      const cleanName = username.startsWith('@') ? username : `@${username}`;
      if (cars.some(c => c.username.toLowerCase() === cleanName.toLowerCase())) return;

      cars.push({
        id: 'c_' + Date.now(),
        username: cleanName,
        color: color || CAR_COLORS[cars.length % CAR_COLORS.length],
        lane: cars.length % 6,
        x: 0, y: 0,
        distance: 0,
        speed: 180,
        baseSpeed: 175 + Math.random() * 20,
        turboTimer: 0, nitroTimer: 0, oilTimer: 0, stunTimer: 0, shieldTimer: 0,
        spinAngle: 0, driftAngle: 0, badgeOffset: 0,
        rank: cars.length + 1
      });
    }

    function applyAction(car, type, actor) {
      if (!car || isFrozen) return;
      if (type === 'TURBO') {
        car.turboTimer = 2.4;
        playSound('turbo');
        showToast('🔥', `${car.username} ativou TURBO!`);
        floatingTexts.push({ x: car.x, y: car.y - 35, text: '🔥 TURBO!', color: '#f97316', alpha: 1, vy: -25 });
      } else if (type === 'NITRO') {
        car.nitroTimer = 4.8;
        playSound('turbo');
        showToast('⚡', `${car.username} ativou NITRO!`);
        floatingTexts.push({ x: car.x, y: car.y - 35, text: '⚡ NITRO!', color: '#06b6d4', alpha: 1, vy: -25 });
      } else if (type === 'OLEO') {
        if (car.shieldTimer > 0) {
          playSound('shield');
          showToast('🛡️', `${car.username} defendeu o ÓLEO!`);
        } else {
          car.oilTimer = 2.5;
          showToast('🛢️', `${car.username} pegou ÓLEO!`);
          floatingTexts.push({ x: car.x, y: car.y - 35, text: '🛢️ DERRAPOU!', color: '#f59e0b', alpha: 1, vy: -25 });
        }
      } else if (type === 'MISSEL') {
        missiles.push({ targetId: car.id, x: canvas.width / 2, y: canvas.height + 20, progress: 0, angle: 0 });
        playSound('missile');
        showToast('🚀', `MÍSSIL em ${car.username}!`);
      } else if (type === 'ESCUDO') {
        car.shieldTimer = 5.0;
        playSound('shield');
        showToast('🛡️', `${car.username} ativou ESCUDO!`);
        floatingTexts.push({ x: car.x, y: car.y - 35, text: '🛡️ ESCUDO!', color: '#c084fc', alpha: 1, vy: -25 });
      }
    }

    function showToast(icon, text) {
      const c = document.getElementById('giftToasts');
      if (!c) return;
      const t = document.createElement('div');
      t.className = 'gift-toast';
      t.innerHTML = `<span>${icon}</span><span style="font-size:11px; font-weight:800;">${text}</span>`;
      c.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    // Cronômetro 90s
    setInterval(() => {
      if (isFrozen) return;
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          triggerTimeOutFinish();
        }
      }
    }, 1000);

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      const str = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      const el = document.getElementById('timerText');
      if (el) {
        el.innerText = str;
        if (timeLeft <= 15) el.classList.add('urgent');
        else el.classList.remove('urgent');
      }
      const pct = (timeLeft / RACE_DURATION) * 100;
      const bar = document.getElementById('progressBarFill');
      if (bar) bar.style.width = pct + '%';
    }

    function triggerTimeOutFinish() {
      isFrozen = true;
      playSound('win');
      cars.sort((a, b) => b.distance - a.distance);

      const modal = document.getElementById('victoryModal');
      if (modal) {
        if (cars[0]) {
          document.getElementById('podium1Name').innerText = cars[0].username;
          document.getElementById('podium1Dist').innerText = Math.floor(cars[0].distance) + 'm';
        }
        if (cars[1]) {
          document.getElementById('podium2Name').innerText = cars[1].username;
          document.getElementById('podium2Dist').innerText = Math.floor(cars[1].distance) + 'm';
        }
        if (cars[2]) {
          document.getElementById('podium3Name').innerText = cars[2].username;
          document.getElementById('podium3Dist').innerText = Math.floor(cars[2].distance) + 'm';
        }
        modal.classList.add('show');
      }

      podiumCountdown = 10;
      document.getElementById('podiumCountdownText').innerText = podiumCountdown;
      clearInterval(podiumInterval);
      podiumInterval = setInterval(() => {
        podiumCountdown--;
        const cntEl = document.getElementById('podiumCountdownText');
        if (cntEl) cntEl.innerText = podiumCountdown;
        if (podiumCountdown <= 0) {
          clearInterval(podiumInterval);
          resetRace();
        }
      }, 1000);
    }

    function resetRace() {
      clearInterval(podiumInterval);
      isFrozen = false;
      timeLeft = RACE_DURATION;
      updateTimerDisplay();

      const modal = document.getElementById('victoryModal');
      if (modal) modal.classList.remove('show');

      cars.forEach((c, idx) => {
        c.distance = 0;
        c.speed = c.baseSpeed;
        c.turboTimer = 0;
        c.nitroTimer = 0;
        c.oilTimer = 0;
        c.stunTimer = 0;
        c.shieldTimer = 0;
        c.spinAngle = 0;
        c.driftAngle = 0;
        c.badgeOffset = 0;
        c.lane = idx % 6;
      });

      particles = [];
      missiles = [];
      floatingTexts = [];
    }

    // ==========================================
    // 4. ATUALIZAÇÃO E RENDERIZAÇÃO CANVAS 2D
    // ==========================================
    let lastTime = performance.now();

    function update(dt) {
      if (isFrozen) return;

      const roadLeft = 32;
      const roadRight = canvas.width - 32;
      const roadWidth = roadRight - roadLeft;
      const laneCount = 6;
      const laneWidth = roadWidth / laneCount;

      let maxDist = 0;
      cars.forEach(c => { if (c.distance > maxDist) maxDist = c.distance; });

      trackScrollY = (trackScrollY + 16) % 10000;

      cars.forEach((car, i) => {
        if (car.turboTimer > 0) car.turboTimer -= dt;
        if (car.nitroTimer > 0) car.nitroTimer -= dt;
        if (car.oilTimer > 0) { car.oilTimer -= dt; car.spinAngle += dt * 14; } else { car.spinAngle = 0; }
        if (car.stunTimer > 0) car.stunTimer -= dt;
        if (car.shieldTimer > 0) car.shieldTimer -= dt;

        let spd = car.baseSpeed;
        if (car.turboTimer > 0) spd += 125;
        if (car.nitroTimer > 0) spd += 65;
        if (car.oilTimer > 0) spd *= 0.45;
        if (car.stunTimer > 0) spd *= 0.25;
        spd += Math.sin(performance.now() * 0.0022 + i * 1.5) * 8;
        car.speed = spd;

        car.distance += (spd / 3.6) * dt;

        const targetX = roadLeft + (car.lane + 0.5) * laneWidth;
        const diffX = targetX - car.x;
        car.x += diffX * 0.12;
        car.driftAngle = Math.max(-0.25, Math.min(0.25, diffX * 0.02));

        car.y = (canvas.height * 0.68) - (car.distance - maxDist) * 4.4;
        car.y = Math.max(125, Math.min(canvas.height - 75, car.y));

        if (Math.random() < 0.009 && car.oilTimer <= 0) {
          const delta = Math.random() > 0.5 ? 1 : -1;
          car.lane = Math.max(0, Math.min(laneCount - 1, car.lane + delta));
        }

        if (car.turboTimer > 0) {
          [-6, 6].forEach(s => {
            particles.push({ x: car.x + s, y: car.y + 24, vx: (Math.random()-0.5)*2, vy: Math.random()*8+8, size: 6, color: '#f97316', alpha: 1 });
          });
        }
        if (car.nitroTimer > 0) {
          [-5, 5].forEach(s => {
            particles.push({ x: car.x + s, y: car.y + 24, vx: (Math.random()-0.5)*1.5, vy: Math.random()*9+6, size: 5, color: '#06b6d4', alpha: 0.95 });
          });
        }
      });

      cars.sort((a, b) => b.distance - a.distance);
      cars.forEach((c, idx) => c.rank = idx + 1);

      // Deslocamento de tags para evitar sobreposição
      for (let i = 0; i < cars.length; i++) cars[i].badgeOffset = 0;
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          if (Math.abs(cars[i].x - cars[j].x) < 64 && Math.abs(cars[i].y - cars[j].y) < 28) {
            if (cars[i].rank < cars[j].rank) cars[i].badgeOffset = 18;
            else cars[j].badgeOffset = 18;
          }
        }
      }

      // Mísseis
      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        const target = cars.find(c => c.id === m.targetId);
        if (!target) { missiles.splice(i, 1); continue; }
        m.progress += dt * 1.6;
        m.x += (target.x - m.x) * 0.18;
        m.y += (target.y - m.y) * 0.22;
        if (m.progress >= 1 || Math.hypot(m.x - target.x, m.y - target.y) < 18) {
          missiles.splice(i, 1);
          if (target.shieldTimer > 0) {
            playSound('shield');
          } else {
            playSound('explosion');
            target.stunTimer = 2.4;
            for (let e = 0; e < 30; e++) {
              const a = Math.random() * Math.PI * 2;
              particles.push({ x: target.x, y: target.y, vx: Math.cos(a)*7, vy: Math.sin(a)*7, size: 7, color: '#ef4444', alpha: 1 });
            }
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.04; p.size *= 0.96;
        if (p.alpha <= 0 || p.size <= 0.5) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * dt; ft.alpha -= dt * 0.9;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }

      speedLines.forEach(l => {
        l.y += l.speed;
        if (l.y > canvas.height + l.length) { l.y = -l.length; l.x = Math.random() * canvas.width; }
      });

      // Tabela de Líderes DOM
      const listEl = document.getElementById('leaderboardList');
      if (listEl) {
        listEl.innerHTML = cars.slice(0, 5).map(c => `
          <div class="leader-row pos-${c.rank}">
            <div class="leader-name">
              <span class="badge-pos">${c.rank}º</span>
              <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${c.color}"></span>
              <span>${c.username}</span>
            </div>
            <div class="leader-dist">${Math.floor(c.distance)}m <span style="color:#94a3b8; font-size:9px;">(${Math.round(c.speed)}km/h)</span></div>
          </div>
        `).join('');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const roadLeft = 32;
      const roadRight = canvas.width - 32;
      const roadWidth = roadRight - roadLeft;
      const laneCount = 6;
      const laneWidth = roadWidth / laneCount;

      // Asfalto
      const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      grad.addColorStop(0, '#070a12');
      grad.addColorStop(roadLeft / canvas.width, '#0f172a');
      grad.addColorStop(0.5, '#151f33');
      grad.addColorStop(roadRight / canvas.width, '#0f172a');
      grad.addColorStop(1, '#070a12');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#172033';
      ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

      // Zebras 3D
      const curbSize = 10;
      const curbSegment = 26;
      for (let y = -curbSegment * 2; y < canvas.height + curbSegment * 2; y += curbSegment) {
        const isRed = Math.floor((y + trackScrollY) / curbSegment) % 2 === 0;
        const curY = y + (trackScrollY % curbSegment);
        ctx.fillStyle = isRed ? '#dc2626' : '#f8fafc';
        ctx.fillRect(roadLeft - curbSize, curY, curbSize, curbSegment);
        ctx.fillRect(roadRight, curY, curbSize, curbSegment);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(roadLeft - curbSize, curY + curbSegment - 2, curbSize, 2);
        ctx.fillRect(roadRight, curY + curbSegment - 2, curbSize, 2);
      }

      // Linhas das 6 Faixas
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -trackScrollY;
      for (let i = 1; i < laneCount; i++) {
        const lx = roadLeft + i * laneWidth;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Speed lines
      if (!isFrozen) {
        speedLines.forEach(l => {
          ctx.strokeStyle = `rgba(255, 255, 255, ${l.alpha * 0.5})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(l.x, l.y);
          ctx.lineTo(l.x, l.y + l.length);
          ctx.stroke();
        });
      }

      // Desenha Carros
      cars.forEach(car => drawSuperCar(ctx, car));

      // Mísseis
      missiles.forEach(m => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(m.x, m.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Partículas
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Floating text
      floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.font = '900 11px sans-serif';
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });
    }

    function drawSuperCar(ctx, car) {
      ctx.save();
      ctx.translate(car.x, car.y);
      if (car.spinAngle !== 0) ctx.rotate(car.spinAngle);
      else if (car.driftAngle) ctx.rotate(car.driftAngle);

      const w = 22;
      const h = 46;

      // Facho de faróis
      const hGrad = ctx.createLinearGradient(0, -h/2, 0, -h/2 - 100);
      hGrad.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
      hGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
      ctx.fillStyle = hGrad;
      ctx.beginPath();
      ctx.moveTo(-w/2 + 3, -h/2);
      ctx.lineTo(-w/2 - 20, -h/2 - 95);
      ctx.lineTo(w/2 + 20, -h/2 - 95);
      ctx.lineTo(w/2 - 3, -h/2);
      ctx.closePath();
      ctx.fill();

      // Neon Underglow
      const underglowColor = car.turboTimer > 0 ? '#f97316' : car.nitroTimer > 0 ? '#06b6d4' : car.color;
      const uGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 32);
      uGrad.addColorStop(0, underglowColor + '55');
      uGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = uGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 32, 0, Math.PI * 2);
      ctx.fill();

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.roundRect(-w/2 + 2, -h/2 + 3, w, h + 2, 7);
      ctx.fill();

      // Pneus
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-w/2 - 3, -h/2 + 6, 4, 10);
      ctx.fillRect(w/2 - 1, -h/2 + 6, 4, 10);
      ctx.fillRect(-w/2 - 3, h/2 - 16, 4, 11);
      ctx.fillRect(w/2 - 1, h/2 - 16, 4, 11);

      // Chassi
      const bGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
      bGrad.addColorStop(0, car.color);
      bGrad.addColorStop(0.35, '#ffffff33');
      bGrad.addColorStop(0.7, car.color);
      bGrad.addColorStop(1, '#00000044');
      ctx.fillStyle = bGrad;
      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, 7);
      ctx.fill();

      // Faixas de corrida
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillRect(-2.5, -h/2 + 2, 1.8, h - 8);
      ctx.fillRect(0.7, -h/2 + 2, 1.8, h - 8);

      // Pára-brisa
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-w/2 + 3, -h/2 + 12, w - 6, 10);

      // Teto & Aerofólio
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-w/2 + 4, -h/2 + 22, w - 8, 11);
      ctx.fillRect(-w/2 - 1, h/2 - 5, w + 2, 3.5);

      // Faróis
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-w/2 + 2, -h/2, 4.5, 2);
      ctx.fillRect(w/2 - 6.5, -h/2, 4.5, 2);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
      ctx.fillRect(-w/2 + 3, h/2 - 2, w - 6, 2);

      // Escudo
      if (car.shieldTimer > 0) {
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, 31, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      // TAG DE NOME ANTI-SOBREPOSIÇÃO
      ctx.save();
      const baseBadgeY = car.y - 36;
      const dynamicOffset = (car.lane % 2 === 1 ? 16 : 0) + (car.badgeOffset || 0);
      const bY = baseBadgeY - dynamicOffset;

      ctx.font = 'bold 9px sans-serif';
      const txt = `${car.rank}º ${car.username}`;
      const pW = Math.max(ctx.measureText(txt).width + 12, 58);

      ctx.fillStyle = 'rgba(11, 15, 25, 0.95)';
      ctx.strokeStyle = car.rank === 1 ? '#eab308' : car.rank === 2 ? '#cbd5e1' : car.rank === 3 ? '#d97706' : 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(car.x - pW / 2, bY - 10, pW, 16, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = car.rank === 1 ? '#eab308' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(txt, car.x, bY + 1.5);
      ctx.restore();
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    initCars();
    updateTimerDisplay();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
