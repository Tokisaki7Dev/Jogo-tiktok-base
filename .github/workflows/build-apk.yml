name: Build Android APK (Racha Live)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências e compilar frontend
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://meu-backend.trycloudflare.com' }}
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Dar permissão ao Gradle Wrapper e gerar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copiar APK para pasta apk/
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/racha-live-android.apk

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: racha-live-android-apk
          path: apk/racha-live-android.apk

      - name: Publicar APK nos Releases do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: Racha Live Android APK
          files: apk/racha-live-android.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
